monitor = ,1000x700@60,auto,1

input {
    kb_layout = us
}

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
}

decoration {
    rounding = 12
    blur {
        enabled = true
    }
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Run Hyprland from the repository root so this relative path resolves.
plugin = ./hyprtouchbar.so

plugin:hyprtouchbar {
    enabled = true
    stylus_drag_enabled = true
    csd_detection = auto
    csd_drag_enabled = true
    csd_touch_emulation = true
    csd_drag_fallback = false
    minimize_action = movetoworkspacesilent special:minimized
}

exec-once = alacritty
bind = SUPER, Q, killactive
bind = SUPER, M, exit
